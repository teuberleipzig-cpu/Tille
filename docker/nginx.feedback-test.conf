limit_req_zone $binary_remote_addr zone=feedback_api:1m rate=10r/m;
upstream feedback_api_upstream { server feedback-api:3000; }
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { proxy_pass http://feedback_api_upstream; }
  location = /api/feedback { limit_req zone=feedback_api burst=3 nodelay; proxy_pass http://feedback_api_upstream; proxy_set_header Content-Type $content_type; proxy_set_header X-Real-IP $remote_addr; }
  location = /api/feedback/config { proxy_pass http://feedback_api_upstream; }
  location / { try_files $uri $uri/ =404; }
}
