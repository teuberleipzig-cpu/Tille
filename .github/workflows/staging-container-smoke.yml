name: Staging container smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'scripts/content/**'
      - 'tests/content-*.test.mjs'
      - 'tests/staging-cutover-integration.test.mjs'
      - 'tests/staging-acceptance.test.mjs'
      - 'tests/helpers/staging-acceptance-fixture.mjs'
      - 'index.html'
      - 'event.html'
      - 'public/site/js/event-*.js'
      - 'assets/dates-mobile.css'
      - 'assets/event-categories.css'
      - 'scripts/events/**'
      - 'scripts/filemaker/contracts-v2/dates.mjs'
      - 'scripts/filemaker/contracts-v2/event-contract.mjs'
      - 'scripts/filemaker/filemaker-event-model.mjs'
      - 'public/admin/index.html'
      - 'public/admin/js/auto-github-load.js'
      - 'public/admin/js/events-meta.js'
      - 'public/admin/js/core/event-storage-admin.js'
      - 'public/admin/js/core/event-image-only-save.js'
      - 'tests/event-contract-v2.test.mjs'
      - 'tests/event-contract-v2-timetable.test.mjs'
      - 'tests/monthly-event-storage.test.mjs'
      - 'tests/event-multidate-storage.test.mjs'
      - 'tests/filemaker-event-intake.test.mjs'
      - 'tests/filemaker-staging-workspace.test.mjs'
      - 'tests/event-seo.test.mjs'
      - 'tests/dates-mobile.test.mjs'
      - 'tests/admin-event-image-only.test.mjs'
      - 'tests/admin-event-image-only-ui.test.mjs'
      - 'tests/admin-staging-ui.test.mjs'
      - 'tests/event-categories.test.mjs'
      - 'tests/fixtures/event-contract-v2.json'
      - 'tests/fixtures/filemaker-event.json'
      - 'tests/helpers/event-categories-fixture.mjs'
      - 'tests/helpers/serve-event-categories-fixture.mjs'
      - 'tests/helpers/content-bootstrap-fixture.mjs'
      - 'tests/helpers/admin-staging-github.mjs'
      - 'tests/helpers/portal-github-fixture.mjs'
      - 'robots.txt'
      - 'robots.staging.txt'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/staging-container-smoke.yml'

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test composition contracts on Linux
        run: node --test tests/content-bootstrap.test.mjs tests/content-foundation.test.mjs tests/content-composition.test.mjs tests/content-composition-workflow.test.mjs tests/event-contract-v2.test.mjs tests/event-contract-v2-timetable.test.mjs

      - name: Test prepared deployment contracts without deployment
        run: |
          node --test tests/content-deployment.test.mjs tests/content-deployment-e2e.test.mjs tests/content-deployment-workflow.test.mjs tests/content-deployment-cli.test.mjs
          node --test tests/staging-cutover-integration.test.mjs
          node --test tests/staging-acceptance.test.mjs

      - name: Test full event regressions
        run: |
          node --test tests/monthly-event-storage.test.mjs tests/event-multidate-storage.test.mjs tests/filemaker-event-intake.test.mjs tests/filemaker-staging-workspace.test.mjs tests/event-seo.test.mjs
          node --test tests/dates-mobile.test.mjs tests/admin-event-image-only.test.mjs tests/admin-event-image-only-ui.test.mjs tests/admin-staging-ui.test.mjs tests/event-categories.test.mjs

      - name: Bind staging content and compose isolated context
        env:
          CODE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/content/staging:refs/remotes/origin/content/staging
          content_sha="$(git rev-parse refs/remotes/origin/content/staging)"
          node scripts/content/compose-site.mjs \
            --environment staging \
            --code-sha "$CODE_SHA" \
            --content-ref content/staging \
            --content-sha "$content_sha" \
            --output "$RUNNER_TEMP/composed-site" > "$RUNNER_TEMP/composition-report.json"
          node -e 'const r = require(process.env.RUNNER_TEMP + "/composition-report.json"); console.log(JSON.stringify({environment:r.environment,codeSha:r.codeSha,contentSha:r.contentSha,contentTreeSha:r.contentTreeSha,artifactId:r.artifactId,contentFileCount:r.contentFileCount,valid:r.valid}));'

      - name: Build STAGING image
        run: |
          set -euo pipefail
          docker build \
            --build-arg DEPLOY_TARGET=staging \
            -f "$RUNNER_TEMP/composed-site/docker/Dockerfile" \
            -t tille-staging-smoke "$RUNNER_TEMP/composed-site"

      - name: Start and validate STAGING container
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name tille-staging-smoke \
            -p 18081:8080 \
            tille-staging-smoke

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18081/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "STAGING container did not become healthy within 30 seconds." >&2
            docker logs tille-staging-smoke >&2 || true
            exit 1
          fi

          docker exec tille-staging-smoke nginx -t

      - name: Test STAGING HTTP matrix
        shell: bash
        run: |
          set -euo pipefail
          base_url='http://127.0.0.1:18081'
          response_dir="$(mktemp -d)"
          headers="$response_dir/headers"
          body="$response_dir/body"
          status=''

          fetch() {
            local endpoint="$1"
            status="$(curl --silent --show-error \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$base_url$endpoint")"
          }

          fail() {
            local endpoint="$1"
            shift
            echo "STAGING check failed for $endpoint: $*" >&2
            echo "HTTP status: $status" >&2
            echo 'Response headers:' >&2
            sed 's/^/  /' "$headers" >&2
            exit 1
          }

          assert_status() {
            local endpoint="$1" expected="$2"
            fetch "$endpoint"
            [[ "$status" == "$expected" ]] || fail "$endpoint" "expected HTTP $expected, got $status"
          }

          header_value() {
            local name="$1"
            awk -F ': *' -v wanted="$name" '
              tolower($1) == tolower(wanted) {
                sub(/\r$/, "", $2)
                print $2
              }
            ' "$headers"
          }

          assert_header_contains() {
            local endpoint="$1" name="$2" expected="$3" actual
            actual="$(header_value "$name")"
            grep -Fqi -- "$expected" <<<"$actual" || fail "$endpoint" "expected $name to contain '$expected', got '${actual:-<missing>}'"
          }

          assert_noindex_and_no_cache() {
            local endpoint="$1"
            assert_status "$endpoint" 200
            assert_header_contains "$endpoint" X-Robots-Tag 'noindex, nofollow, noarchive'
            assert_header_contains "$endpoint" Cache-Control 'no-cache'
          }

          assert_noindex_and_no_cache /
          assert_noindex_and_no_cache /index.html
          assert_noindex_and_no_cache /public/resident-portal/js/core/config.js
          assert_noindex_and_no_cache /public/resident-portal/css/portal.css

          for endpoint in /public/events/data/manifest.json /public/events/data/months/2026-08.json; do
            assert_status "$endpoint" 200
            assert_header_contains "$endpoint" X-Robots-Tag 'noindex, nofollow, noarchive'
            assert_header_contains "$endpoint" Cache-Control 'no-store'
          done

          endpoint='/robots.txt'
          assert_status "$endpoint" 200
          assert_header_contains "$endpoint" X-Robots-Tag 'noindex, nofollow, noarchive'
          grep -Eqi '^User-agent:[[:space:]]*\*[[:space:]]*$' "$body" || fail "$endpoint" 'missing User-agent: *'
          grep -Eqi '^Disallow:[[:space:]]*/[[:space:]]*$' "$body" || fail "$endpoint" 'missing Disallow: /'
          ! grep -Eqi '^Allow:' "$body" || fail "$endpoint" 'must not contain Allow'
          ! grep -Fqi 'www.distillery.de/sitemap.xml' "$body" || fail "$endpoint" 'must not contain the LIVE sitemap URL'

          for endpoint in /sitemap.xml /__staging-smoke-does-not-exist__ /public/residents/data/residents-backup-before-restore.json /public/residents/data/recovery-note.txt; do
            assert_status "$endpoint" 404
            assert_header_contains "$endpoint" X-Robots-Tag 'noindex, nofollow, noarchive'
            grep -Fqi 'Seite nicht gefunden' "$body" || fail "$endpoint" 'custom 404 body was not served'
          done

          endpoint='/healthz'
          assert_status "$endpoint" 200
          assert_header_contains "$endpoint" X-Robots-Tag 'noindex, nofollow, noarchive'
          [[ "$(tr -d '\r\n' < "$body")" == 'ok' ]] || fail "$endpoint" "expected body 'ok'"

          for endpoint in /docker/nginx.conf /docker/nginx.staging.conf /robots.staging.txt; do
            assert_status "$endpoint" 404
            assert_header_contains "$endpoint" X-Robots-Tag 'noindex, nofollow, noarchive'
          done

      - name: Stop STAGING container
        if: always()
        run: docker rm -f tille-staging-smoke 2>/dev/null || true

      - name: Build DEFAULT / LIVE-safety image
        # Same controlled STAGING content; only tests Dockerfile default policy.
        # Never fetch content/live or claim this is a live-ready artifact.
        run: |
          set -euo pipefail
          docker build \
            -f "$RUNNER_TEMP/composed-site/docker/Dockerfile" \
            -t tille-default-smoke "$RUNNER_TEMP/composed-site"

      - name: Start and validate DEFAULT container
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name tille-default-smoke \
            -p 18082:8080 \
            tille-default-smoke

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18082/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "DEFAULT container did not become healthy within 30 seconds." >&2
            docker logs tille-default-smoke >&2 || true
            exit 1
          fi

          docker exec tille-default-smoke nginx -t

      - name: Test DEFAULT / LIVE-safety HTTP matrix
        shell: bash
        run: |
          set -euo pipefail
          base_url='http://127.0.0.1:18082'
          response_dir="$(mktemp -d)"
          headers="$response_dir/headers"
          body="$response_dir/body"
          status=''

          fetch() {
            local endpoint="$1"
            status="$(curl --silent --show-error \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$base_url$endpoint")"
          }

          fail() {
            local endpoint="$1"
            shift
            echo "DEFAULT check failed for $endpoint: $*" >&2
            echo "HTTP status: $status" >&2
            echo 'Response headers:' >&2
            sed 's/^/  /' "$headers" >&2
            exit 1
          }

          assert_status() {
            local endpoint="$1" expected="$2"
            fetch "$endpoint"
            [[ "$status" == "$expected" ]] || fail "$endpoint" "expected HTTP $expected, got $status"
          }

          header_value() {
            local name="$1"
            awk -F ': *' -v wanted="$name" '
              tolower($1) == tolower(wanted) {
                sub(/\r$/, "", $2)
                print $2
              }
            ' "$headers"
          }

          assert_header_contains() {
            local endpoint="$1" name="$2" expected="$3" actual
            actual="$(header_value "$name")"
            grep -Fqi -- "$expected" <<<"$actual" || fail "$endpoint" "expected $name to contain '$expected', got '${actual:-<missing>}'"
          }

          assert_no_noindex() {
            local endpoint="$1" actual
            actual="$(header_value X-Robots-Tag)"
            ! grep -Fqi 'noindex' <<<"$actual" || fail "$endpoint" "must not contain a noindex X-Robots-Tag, got '$actual'"
          }

          endpoint='/'
          assert_status "$endpoint" 200
          assert_no_noindex "$endpoint"
          assert_header_contains "$endpoint" Cache-Control 'no-cache'

          for endpoint in /index.html /public/resident-portal/js/core/config.js /public/resident-portal/css/portal.css; do
            assert_status "$endpoint" 200
            assert_no_noindex "$endpoint"
            assert_header_contains "$endpoint" Cache-Control 'no-cache'
          done

          for endpoint in /public/events/data/manifest.json /public/events/data/months/2026-08.json; do
            assert_status "$endpoint" 200
            assert_no_noindex "$endpoint"
            assert_header_contains "$endpoint" Cache-Control 'no-store'
          done

          endpoint='/robots.txt'
          assert_status "$endpoint" 200
          assert_no_noindex "$endpoint"
          grep -Eqi '^User-agent:[[:space:]]*\*[[:space:]]*$' "$body" || fail "$endpoint" 'missing User-agent: *'
          grep -Eqi '^Allow:[[:space:]]*/[[:space:]]*$' "$body" || fail "$endpoint" 'missing Allow: /'
          grep -Fqi 'Sitemap: https://www.distillery.de/sitemap.xml' "$body" || fail "$endpoint" 'missing LIVE sitemap reference'

          endpoint='/sitemap.xml'
          assert_status "$endpoint" 200
          assert_no_noindex "$endpoint"

          endpoint='/healthz'
          assert_status "$endpoint" 200
          assert_no_noindex "$endpoint"
          [[ "$(tr -d '\r\n' < "$body")" == 'ok' ]] || fail "$endpoint" "expected body 'ok'"

      - name: Stop DEFAULT container
        if: always()
        run: docker rm -f tille-default-smoke 2>/dev/null || true
