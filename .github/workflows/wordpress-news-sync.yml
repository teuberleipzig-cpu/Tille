name: Controlled WordPress news sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate WordPress or update the controlled Draft PR
        required: true
        type: choice
        options:
          - validate-only
          - sync-pr

concurrency:
  group: wordpress-news-sync
  cancel-in-progress: false

jobs:
  validate-only:
    if: inputs.mode == 'validate-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORDPRESS_BASE_URL: ${{ vars.WORDPRESS_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository variable
        run: test -n "$WORDPRESS_BASE_URL" || (echo "WORDPRESS_BASE_URL is not configured." && exit 1)
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Validate WordPress news
        run: node scripts/news/prepare-sync.mjs --mode validate-only --workspace "$GITHUB_WORKSPACE"

  sync-pr:
    if: inputs.mode == 'sync-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      WORDPRESS_BASE_URL: ${{ vars.WORDPRESS_BASE_URL }}
      AUTOMATION_BRANCH: automation/wordpress-news-sync
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository variable
        run: test -n "$WORDPRESS_BASE_URL" || (echo "WORDPRESS_BASE_URL is not configured." && exit 1)
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Generate and validate WordPress news
        id: sync
        run: node scripts/news/prepare-sync.mjs --mode sync-pr --workspace "$GITHUB_WORKSPACE"
      - name: Commit controlled output
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          git fetch origin "+refs/heads/$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH" || true
          git switch -C "$AUTOMATION_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- news.html news sitemap.xml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(news\.html|news/([^/]+/)?index\.html|sitemap\.xml)$' || true)"
          test -z "$unexpected" || (echo "Unexpected staged paths:" && echo "$unexpected" && exit 1)
          git commit -m "chore: sync wordpress news"
          git push --force-with-lease origin "HEAD:$AUTOMATION_BRANCH"
      - name: Create or update Draft PR
        if: steps.sync.outputs.has_changes == 'true'
        env:
          RECEIVED_POSTS: ${{ steps.sync.outputs.received_posts }}
          ARTICLE_COUNT: ${{ steps.sync.outputs.article_count }}
          ADDED: ${{ steps.sync.outputs.added }}
          UPDATED: ${{ steps.sync.outputs.updated }}
          REMOVED: ${{ steps.sync.outputs.removed }}
          SOURCE_ORIGIN: ${{ steps.sync.outputs.source_origin }}
          SITEMAP_CHANGED: ${{ steps.sync.outputs.sitemap_changed }}
        run: |
          body_file="$RUNNER_TEMP/wordpress-news-pr.md"
          {
            echo "## WordPress news sync"
            echo
            echo "- Source: WordPress REST"
            echo "- Posts received: $RECEIVED_POSTS"
            echo "- Generated articles: $ARTICLE_COUNT"
            echo "- Added: ${ADDED:-none}"
            echo "- Updated: ${UPDATED:-none}"
            echo "- Removed: ${REMOVED:-none}"
            echo "- Sitemap updated: $SITEMAP_CHANGED"
            echo "- Trigger time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Source origin: $SOURCE_ORIGIN"
            echo "- Validation: PASS"
            echo "- Auto-merge: disabled"
          } > "$body_file"
          pr_number="$(gh pr list --state open --base main --head "$AUTOMATION_BRANCH" --json number --jq '.[0].number // empty')"
          if test -n "$pr_number"; then
            gh pr edit "$pr_number" --title "Sync WordPress news" --body-file "$body_file"
            pr_is_draft="$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')"
            test "$pr_is_draft" = "true" || gh pr ready "$pr_number" --undo
          else
            gh pr create --draft --base main --head "$AUTOMATION_BRANCH" --title "Sync WordPress news" --body-file "$body_file"
          fi
      - name: Report no changes and close stale sync PR
        if: steps.sync.outputs.has_changes != 'true'
        run: |
          echo "No WordPress news changes detected."
          pr_number="$(gh pr list --state open --base main --head "$AUTOMATION_BRANCH" --json number --jq '.[0].number // empty')"
          if test -n "$pr_number"; then
            gh pr close "$pr_number"
            gh pr comment "$pr_number" --body "Closing stale WordPress news sync PR because the current WordPress publish state produces no changes against main." || true
          fi
