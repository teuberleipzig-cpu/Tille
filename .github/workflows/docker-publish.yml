name: Build and publish container image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'reports/**'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA approved for this staging deployment
        required: false
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/teuberleipzig-cpu/tille

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify expected deployment SHA
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA" || (echo "Checked out SHA $actual_sha does not match expected deployment SHA $EXPECTED_SHA." >&2 && exit 1)

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            DEPLOY_TARGET=staging
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Reload container on vps03
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: vps03.itlej.de
          username: deploy-www-test-distillery
          key: ${{ secrets.VPS03_DEPLOY_SSH_KEY }}
          # The account's authorized_keys forces the pull+reload script for
          # any command sent here, so this "script" value is cosmetic —
          # but keep it accurate for readability.
          script: /usr/local/sbin/deploy-www-test-distillery.sh
