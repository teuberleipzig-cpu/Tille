name: FileMaker event intake

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [validate-only, sync-pr]
      operation:
        required: true
        type: choice
        options: [upsert, remove]
      environment:
        required: true
        type: choice
        options: [staging, live]
      event_json:
        required: true
        type: string

concurrency:
  group: filemaker-event-intake
  cancel-in-progress: false

jobs:
  validate-only:
    if: inputs.mode == 'validate-only'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FILEMAKER_MODE: ${{ inputs.mode }}
      FILEMAKER_OPERATION: ${{ inputs.operation }}
      FILEMAKER_ENVIRONMENT: ${{ inputs.environment }}
      FILEMAKER_EVENT_JSON: ${{ inputs.event_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run FileMaker-scoped tests
        run: node --test tests/filemaker-event-intake.test.mjs tests/monthly-event-storage.test.mjs tests/event-seo.test.mjs tests/filemaker-staging*.test.mjs
      - name: Validate composed staging snapshot (no writes)
        run: node scripts/filemaker/run-staging-writer.mjs

  sync-pr:
    if: inputs.mode == 'sync-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      FILEMAKER_MODE: ${{ inputs.mode }}
      FILEMAKER_OPERATION: ${{ inputs.operation }}
      FILEMAKER_ENVIRONMENT: ${{ inputs.environment }}
      FILEMAKER_EVENT_JSON: ${{ inputs.event_json }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run FileMaker-scoped tests
        run: node --test tests/filemaker-event-intake.test.mjs tests/monthly-event-storage.test.mjs tests/event-seo.test.mjs tests/filemaker-staging*.test.mjs
      - name: Apply staging content through verified SHA-gated PR
        # Code stays on its workflow SHA; composition lives in RUNNER_TEMP.
        # Future dispatch requires coordinated activation with PR #104.
        run: node scripts/filemaker/run-staging-writer.mjs
