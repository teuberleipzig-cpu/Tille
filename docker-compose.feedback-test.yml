services:
  website:
    image: nginxinc/nginx-unprivileged:alpine
    ports: ["18083:8080"]
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.feedback-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [feedback-api]
  feedback-api:
    build: ./feedback-api
    environment:
      PORT: "3000"
      BOARD_PROVIDER: fake
      RECAPTCHA_ENABLED: "false"
      RATE_LIMIT_MAX: "50"
